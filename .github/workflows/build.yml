name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Organize Folders and Flutter Project
        run: |
          mkdir temp_src
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'temp_src' -exec mv {} temp_src/ \;
          flutter create --org com.example --project-name istiqamah .
          rm -rf lib/*
          mkdir -p lib/screens lib/services lib/models
          
          # Move screens
          mv temp_src/*screen*.dart lib/screens/ 2>/dev/null || true
          mv temp_src/*dashboard*.dart lib/screens/ 2>/dev/null || true
          
          # Move services
          mv temp_src/*service*.dart lib/services/ 2>/dev/null || true
          
          # Move models
          mv temp_src/*model*.dart lib/models/ 2>/dev/null || true
          
          # Move remaining dart files to lib
          mv temp_src/main.dart lib/ 2>/dev/null || true
          mv temp_src/*.dart lib/ 2>/dev/null || true
          
          # Restore configurations
          cp temp_src/pubspec.yaml . 2>/dev/null || true
          mkdir -p android/app/src/main/
          cp temp_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          rm -rf temp_src

      - name: Enable Core Library Desugaring
        run: |
          sed -i '/compileSdkVersion/c\    compileSdkVersion 35' android/app/build.gradle || true
          sed -i '/compileSdk/c\    compileSdk = 35' android/app/build.gradle.kts || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-App
          path: build/app/outputs/flutter-apk/app-release.apk
