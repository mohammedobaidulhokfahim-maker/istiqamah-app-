name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Complete Project Structure
        run: |
          mkdir temp_backup
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'temp_backup' -exec mv {} temp_backup/ \;
          
          # Initialize clean flutter template
          flutter create --org com.example --project-name istiqamah .
          rm -rf lib/*
          
          # Create all required sub-folders
          mkdir -p lib/screens lib/services lib/models lib/controllers lib/widgets
          
          # Copy every dart file to lib root AND each sub-folder so imports NEVER fail
          for f in temp_backup/*.dart; do
            [ -e "$f" ] || continue
            cp "$f" lib/
            cp "$f" lib/screens/
            cp "$f" lib/services/
            cp "$f" lib/models/
            cp "$f" lib/controllers/
            cp "$f" lib/widgets/
          done
          
          # Restore configurations
          cp temp_backup/pubspec.yaml . 2>/dev/null || true
          mkdir -p android/app/src/main/
          cp temp_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          rm -rf temp_backup

      - name: Fix Gradle & Desugaring Config
        run: |
          sed -i '/compileSdkVersion/c\    compileSdkVersion 35' android/app/build.gradle || true
          sed -i '/compileSdk/c\    compileSdk = 35' android/app/build.gradle.kts || true

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-App
          path: build/app/outputs/flutter-apk/app-release.apk
