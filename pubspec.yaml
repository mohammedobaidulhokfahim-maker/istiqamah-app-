name: istiqamah
description: Istiqamah (LifeForge) - habit and lifestyle discipline app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.4.0
  android_alarm_manager_plus: ^4.0.4
  vibration: ^2.0.0
  provider: ^6.1.2
  intl: any
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  shared_preferences: ^2.3.2
  android_intent_plus: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
